# Canonical deploy: /Volumes/XPG SSD 1T/projects/postiz (legal/ + nginx.conf + docker-compose).
# This snippet is a standalone fallback if you use host nginx instead of the Postiz container.
#
# Serve legal pages on postiz.nourdaily.com without touching the Postiz app.
#
# 1. Copy HTML files to the server:
#      sudo mkdir -p /var/www/postiz-legal
#      sudo cp privacy.html terms.html /var/www/postiz-legal/
#
# 2. Include this snippet in the nginx server block for postiz.nourdaily.com
#    (before the proxy_pass to Postiz), then reload nginx:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 3. Verify in a browser (incognito):
#      https://postiz.nourdaily.com/privacy
#      https://postiz.nourdaily.com/terms
#
# 4. Update TikTok Developer Portal (Production → App details):
#      Privacy Policy URL: https://postiz.nourdaily.com/privacy
#      Terms of Service URL: https://postiz.nourdaily.com/terms

location = /privacy {
    default_type text/html;
    alias /var/www/postiz-legal/privacy.html;
}

location = /terms {
    default_type text/html;
    alias /var/www/postiz-legal/terms.html;
}
