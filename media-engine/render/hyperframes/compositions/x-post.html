<!-- hyperframes-registry-item: x-post -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 320px;
        font-family: Inter, system-ui, sans-serif;
      }

      [data-composition-id="x-post"] .x-card {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 28px;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 32px;
        grid-template-rows: auto auto;
        column-gap: 14px;
        row-gap: 10px;
        align-items: start;
        padding: 18px 20px;
        background: #15202b;
        border-radius: 16px;
        border: 1px solid #38444d;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        overflow: visible;
      }

      [data-composition-id="x-post"] .avatar {
        grid-row: 1 / span 2;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
      }

      [data-composition-id="x-post"] .identity {
        grid-column: 2;
        grid-row: 1;
        display: block;
        line-height: 1.2;
      }

      [data-composition-id="x-post"] .display-name {
        display: inline;
        font-size: 22px;
        font-weight: 700;
        color: #e7e9ea;
        margin-right: 8px;
      }

      [data-composition-id="x-post"] .handle {
        display: inline;
        font-size: 18px;
        font-weight: 400;
        color: #8b98a5;
      }

      [data-composition-id="x-post"] .x-logo {
        grid-column: 3;
        grid-row: 1;
        width: 28px;
        height: 28px;
      }

      [data-composition-id="x-post"] .x-logo svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      [data-composition-id="x-post"] .tweet-body {
        grid-column: 2 / span 2;
        grid-row: 2;
        font-size: 22px;
        font-weight: 400;
        color: #e7e9ea;
        line-height: 1.3;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="x-post"
      data-width="1080"
      data-height="320"
      data-start="0"
      data-duration="5"
    >
      <div id="card" class="clip x-card" data-start="0" data-duration="5" data-track-index="0">
        <img class="avatar" src="assets/avatar.jpg" alt="HeyGen" crossorigin="anonymous" />
        <div class="identity">
          <span class="display-name">HeyGen</span>
          <span class="handle">@heygen_official</span>
        </div>
        <div class="x-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#e7e9ea">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            />
          </svg>
        </div>
        <div class="tweet-body">New episode out now.</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      var card = document.getElementById("card");

      gsap.set(card, { opacity: 0 });

      tl.to(card, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.to(card, { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.2);

      window.__timelines["x-post"] = tl;
    </script>
  </body>
</html>
