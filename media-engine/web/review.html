<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Engine Review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --line: #2a2f3a;
        --text: #f2f5f8;
        --muted: #9aa4b2;
        --accent: #45b36b;
        --warn: #f0b84f;
        --danger: #ef6b73;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        border-bottom: 1px solid var(--line);
        padding: 18px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      main {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: calc(100vh - 73px);
      }
      aside {
        border-right: 1px solid var(--line);
        padding: 18px;
      }
      section {
        padding: 20px 24px;
      }
      h1, h2 { margin: 0; letter-spacing: 0; }
      h1 { font-size: 20px; }
      h2 { font-size: 15px; margin-bottom: 14px; }
      .muted { color: var(--muted); font-size: 13px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0;
      }
      select, button {
        background: #11141a;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }
      button.primary { border-color: var(--accent); color: #dff8e6; }
      button.warn { border-color: var(--warn); color: #ffedc2; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }
      .clip-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
      .badge {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .danger { color: var(--danger); }
      @media (max-width: 760px) {
        main { grid-template-columns: 1fr; }
        aside { border-right: 0; border-bottom: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Nourbit Review Queue</h1>
        <div class="muted">Approve clips, switch publishing mode, and keep third-party sources gated.</div>
      </div>
      <button class="primary" id="refresh">Refresh</button>
    </header>
    <main>
      <aside>
        <h2>Platform Modes</h2>
        <div class="panel">
          <div class="row"><span>Facebook Reels</span><select><option>review_required</option><option>auto_publish</option><option>export_only</option><option>off</option></select></div>
          <div class="row"><span>YouTube Shorts</span><select><option>review_required</option><option>auto_publish</option><option>export_only</option><option>off</option></select></div>
          <div class="row"><span>TikTok</span><select><option>review_required</option><option>auto_publish</option><option>export_only</option><option>off</option></select></div>
          <div class="row"><span>Instagram Reels</span><select><option>off</option><option>review_required</option><option>auto_publish</option><option>export_only</option></select></div>
        </div>
        <div class="panel">
          <strong>Rights guard</strong>
          <p class="muted">Auto-publish is blocked for public third-party sources until permission evidence is recorded.</p>
        </div>
      </aside>
      <section>
        <h2>Rendered Clips</h2>
        <div class="grid" id="clips"></div>
      </section>
    </main>
    <script>
      const clips = document.getElementById("clips");
      const sample = [
        {
          title_hook: "Untuk Siapa Ibadah Kita?",
          status: "rendered",
          source: "nouraniyyahofficial",
          risk: "manual review required"
        }
      ];
      function render(items) {
        clips.innerHTML = items.map((item) => `
          <article class="panel">
            <div class="clip-title">${item.title_hook}</div>
            <div class="muted">Source: ${item.source}</div>
            <p><span class="badge">${item.status}</span></p>
            <p class="muted">${item.risk}</p>
            <button class="primary">Approve</button>
            <button class="warn">Export</button>
          </article>
        `).join("");
      }
      async function refresh() {
        try {
          const response = await fetch("/api/review");
          if (!response.ok) throw new Error("API not available");
          const items = await response.json();
          render(items.length ? items.map((item) => ({
            title_hook: item.title_hook,
            status: item.status,
            source: item.source_id,
            risk: item.risk_flags_json || "[]",
          })) : sample);
        } catch (_error) {
          render(sample);
        }
      }
      document.getElementById("refresh").addEventListener("click", refresh);
      refresh();
    </script>
  </body>
</html>
