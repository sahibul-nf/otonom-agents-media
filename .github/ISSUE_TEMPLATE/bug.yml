# solo-dev-ai-kit:managed
name: Bug report
description: Something broken or a regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe what you **see** today — not which commit caused it.
        The acceptance criteria section below is required for AI close-out.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happens now?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: markdown
    attributes:
      value: |
        ## Acceptance criteria
        Use unchecked checklist items (`- [ ]`). AI close-out checks these boxes.
  - type: textarea
    id: acceptance
    attributes:
      label: Checklist items
      description: One `- [ ]` line per criterion (do not remove the heading above)
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
