# solo-dev-ai-kit:managed
name: Feature
description: New capability or meaningful improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: What should be true when done? (present tense)
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Acceptance criteria
        Use unchecked checklist items (`- [ ]`). AI close-out checks these boxes.
  - type: textarea
    id: acceptance
    attributes:
      label: Checklist items
      description: One `- [ ]` line per criterion (do not remove the heading above)
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
